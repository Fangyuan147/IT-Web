groups:
  - name: ops-demo-alerts
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter 不可用"
          description: "Prometheus 已连续 2 分钟无法抓取 Node Exporter。"

      - alert: OpsDemoEndpointDown
        expr: probe_success{job="ops-demo-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ops-demo HTTP 服务不可用"
          description: "服务 {{ $labels.service }} 的 HTTP 健康检查失败。"

      - alert: HostDiskUsageHigh
        expr: |
          100 * (
            1 -
            node_filesystem_avail_bytes{mountpoint="/"}
            /
            node_filesystem_size_bytes{mountpoint="/"}
          ) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ubuntu 根分区使用率过高"
          description: "根分区使用率已超过 85%。"

      - alert: HostMemoryUsageHigh
        expr: |
          100 * (
            1 -
            node_memory_MemAvailable_bytes
            /
            node_memory_MemTotal_bytes
          ) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ubuntu 内存使用率过高"
          description: "内存使用率已连续 10 分钟超过 90%。"